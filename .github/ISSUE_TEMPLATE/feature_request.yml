name: Feature request
description: Suggest an idea for ZCodeHUD
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前有什么不便或缺失的能力
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望如何实现（可选）
    validations:
      required: false
