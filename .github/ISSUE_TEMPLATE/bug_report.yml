name: Bug report
description: Report a problem with ZCodeHUD
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供复现步骤与环境信息，便于定位问题。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 清晰描述问题现象
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 一步步描述如何触发该问题
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: e.g. Windows 11 24H2
    validations:
      required: false
  - type: input
    id: node
    attributes:
      label: Node.js 版本
      placeholder: e.g. v22.11.0
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 附上 hud-crash.log 内容或相关截图
    validations:
      required: false
